<style>
  /* 粒子背景 */
  .particle-bg { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .particle-bg .dot { position:absolute; border-radius:50%; animation:particleFloat linear infinite; opacity:0; }
  @keyframes particleFloat {
    0% { transform:translateY(105vh) scale(0) rotate(0deg); opacity:0; }
    15% { opacity:.7; }
    85% { opacity:.12; }
    100% { transform:translateY(-5vh) scale(1.4) rotate(180deg); opacity:0; }
  }
  /* 精灵球 */
  .pokeball {
    position:relative; width:100px; height:100px; margin:0 auto;
    border-radius:50%;
    background:linear-gradient(to bottom,
      #EE1515 0%, #EE1515 44%,
      #222    44%, #222    56%,
      #fff    56%, #fff   100%
    );
    border:5px solid #222;
    box-shadow:inset 0 -4px 8px rgba(0,0,0,.15),
               inset 0 4px 8px rgba(0,0,0,.1),
               0 0 30px rgba(238,21,21,.35);
  }
  .pokeball .btn-center {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:25px; height:25px;
    background:#fff;
    border-radius:50%;
    border:4px solid #222;
  }

  /* 选择卡片动画 */
  .option-card { transition:all .22s cubic-bezier(.4,0,.2,1); }
  .option-card:hover { transform:translateX(6px); }
  .option-card:active { transform:scale(.98); }
  .option-card.selected { animation:pop .3s ease-out; }

  /* 复制toast */
  .toast-slide { transition: all .35s cubic-bezier(.4,0,.2,1); }

  /* BGM按钮 */
  .bgm-fab {
    animation: pulseGlow 2s ease-in-out infinite;
  }

  /* Canvas 锐利渲染 */
  canvas { image-rendering: auto; }

  /* ═══════════════════════════════════════════ */
  /*  响应式 — 手机端适配                       */
  /* ═══════════════════════════════════════════ */
  @media (max-width: 640px) {
    .container { padding: 8px; padding-top: 16px; align-items: flex-start; }
    .pokeball { width: 72px; height: 72px; }
    .pokeball .btn-center { width: 18px; height: 18px; border-width: 3px; }
    .question-text { font-size: 1.05em; line-height: 1.55; }
    .option-card { padding: 14px 12px !important; gap: 8px !important; border-radius: 14px !important; }
    .option-card span:first-child { width: 28px !important; height: 28px !important; font-size: 0.75em !important; }
    .progress-wrap { margin-bottom: 16px; }
    .progress-text { font-size: 0.72em; }
    .dim-label { width: 3.5rem !important; font-size: 0.7em !important; }
    .btn { padding: 10px 20px !important; font-size: 0.85em !important; }
    .archives-grid { grid-template-columns: repeat(3, 1fr) !important; max-width: 100%; }
    .archives-grid > * { min-width: 0; overflow: hidden; }
    .archives-grid img { width: 36px !important; height: 36px !important; }
  }
  @media (max-width: 380px) {
    .pokeball { width: 60px; height: 60px; }
    .pokeball .btn-center { width: 15px; height: 15px; border-width: 2px; }
    .question-text { font-size: 0.95em; }
    .option-card { padding: 12px 10px !important; font-size: 0.88em !important; }
    .option-card span:first-child { width: 24px !important; height: 24px !important; font-size: 0.7em !important; }
    .archives-grid { gap: 1px !important; grid-template-columns: repeat(3, 1fr) !important; }
    .archives-grid img { width: 28px !important; height: 28px !important; }
    .archives-grid p { font-size: 9px !important; }
    .particles { opacity: 0.4; }
  }
  @media (hover: none) and (pointer: coarse) {
    .option-card:hover { transform: none !important; }
    .option-card:active { background: #edf0ff; }
    .btn:hover { transform: none !important; }
  }

  /* 滚动条 */
  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.15); border-radius:3px; }
</style>

        测试你的宝可梦人格
      </p>

        <span class="flex items-center gap-1.5"><span class="text-lg">📝</span>30题</span>
        <span class="flex items-center gap-1.5"><span class="text-lg">⏱️</span>约5分钟</span>
        <span class="flex items-center gap-1.5"><span class="text-lg">🎯</span>全世代宝可梦</span>
      </div>

      <!-- 按钮 -->
      <button class="btn btn-primary btn-lg px-12 text-lg tracking-wider shadow-lg shadow-primary/30 hover:shadow-primary/50 hover:-translate-y-0.5 transition-all"
              onclick="startQuiz()">
        开 始 测 试
      </button>
      <p class="text-xs text-base-content/30 mt-5">🔮 回答30道题，揭晓你的宝可梦人格</p>
    </div>
  </div>

  <!-- ====== 答题页 ====== -->
  <div class="screen hidden w-full max-w-xl mx-auto" id="screen-quiz">
    <div class="card bg-base-100 shadow-2xl p-6 md:p-8">

      <!-- 进度 -->
      <div class="mb-6">
        <div class="flex justify-between text-xs font-semibold text-base-content/40 mb-2">
          <span id="qLabel">第 1 / 30 题</span>
          <span id="qPercent">0%</span>
        </div>
        <progress class="progress progress-primary w-full h-2" value="0" max="30" id="progressFill"></progress>
      </div>

      <!-- 题号标签 -->
      <div class="badge badge-primary badge-lg mb-4 px-4 py-3" id="qBadge">Q1</div>

      <!-- 题目 -->
      <h2 class="text-xl font-bold mb-6 leading-relaxed" id="qText"></h2>

      <!-- 选项 -->
      <div class="flex flex-col gap-3" id="qOptions"></div>

      <!-- 下一题按钮 -->
      <button class="btn btn-accent btn-block mt-6 btn-disabled" id="btnNext" onclick="nextQuestion()">
        下一题 →
      </button>
    </div>
  </div>

  <!-- ====== 结果页 ====== -->
  <div class="screen hidden w-full max-w-xl mx-auto" id="screen-result">
    <div class="card bg-base-100 shadow-2xl p-6 md:p-10 text-center" id="resultContent">
      <!-- JS 动态渲染 -->
    </div>
  </div>

</div>

<!-- BGM -->

// ============================================================
//  STATE
// ============================================================
let scores = [0,0,0,0,0];
let currentQ = 0;
let selectedIdx = -1;
let results = null;

// ============================================================
//  SCREEN SWITCHING
// ============================================================
function showScreen(name) {
  ['welcome','quiz','result'].forEach(id => {
    const el = document.getElementById('screen-' + id);
    if (id === name) { el.classList.remove('hidden'); el.classList.add('animate-fade-in'); }
    else { el.classList.add('hidden'); el.classList.remove('animate-fade-in'); }
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
//  QUIZ LOGIC
// ============================================================
function startQuiz() {
  scores = [0,0,0,0,0];
  currentQ = 0;
  selectedIdx = -1;
  results = null;
  renderQuestion();
  showScreen('quiz');
}

function renderQuestion() {
  const q = QUESTIONS[currentQ];
  document.getElementById('qLabel').textContent = `第 ${currentQ + 1} / 30 题`;
  document.getElementById('qPercent').textContent = Math.round((currentQ / 30) * 100) + '%';
  document.getElementById('progressFill').value = currentQ;
  document.getElementById('qBadge').textContent = 'Q' + (currentQ + 1);
  document.getElementById('qText').textContent = q.q;

  const container = document.getElementById('qOptions');
  container.innerHTML = '';
  selectedIdx = -1;

  const letters = 'ABCD';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-card flex items-center gap-3 w-full p-4 text-left rounded-2xl border-2 border-base-300 bg-base-200 hover:border-accent hover:bg-accent/5 transition-all';
    btn.innerHTML = `<span class="w-9 h-9 rounded-full bg-base-300 flex items-center justify-center font-bold text-sm text-base-content/50 flex-shrink-0 transition-all">${letters[i]}</span><span class="text-base-content/80">${opt[0]}</span>`;
    btn.addEventListener('click', () => selectOption(i));
    container.appendChild(btn);
  });

  updateNextBtn();
}

function selectOption(idx) {
  selectedIdx = idx;
  const btns = document.querySelectorAll('#qOptions .option-card');
  btns.forEach((b, i) => {
    b.classList.toggle('selected', i === idx);
    if (i === idx) {
      b.classList.add('border-accent', 'bg-accent/5', 'shadow-[0_0_0_4px_rgba(59,76,202,.1)]');
      b.querySelector('span:first-child').classList.add('bg-accent', 'text-white');
      b.querySelector('span:first-child').classList.remove('bg-base-300', 'text-base-content/50');
    } else {
      b.classList.remove('border-accent', 'bg-accent/5', 'shadow-[0_0_0_4px_rgba(59,76,202,.1)]');
      b.querySelector('span:first-child').classList.remove('bg-accent', 'text-white');
      b.querySelector('span:first-child').classList.add('bg-base-300', 'text-base-content/50');
    }
  });
  updateNextBtn();
}

function updateNextBtn() {
  const btn = document.getElementById('btnNext');
  if (selectedIdx >= 0) {
    btn.classList.remove('btn-disabled');
    btn.classList.add('btn-accent');
    btn.textContent = currentQ === 29 ? '🔮 揭晓结果！' : '下一题 →';
  } else {
    btn.classList.add('btn-disabled');
    btn.classList.remove('btn-accent');
    btn.textContent = '下一题 →';
  }
}

function nextQuestion() {
  if (selectedIdx < 0) return;
  const dims = QUESTIONS[currentQ].opts[selectedIdx][1];
  for (let i = 0; i < 5; i++) scores[i] += dims[i];
  if (currentQ < 29) { currentQ++; renderQuestion(); }
  else { normalizeAndCompute(); showScreen('result'); renderResult(); }
}

function normalizeAndCompute() {
  let normalized = scores.map(s => {
    const n = 1 + (s / 30) * 9;
    return Math.max(1, Math.min(10, Math.round(n * 10) / 10));
  });
  computeResults(normalized);
}

function euclideanDist(a, b) {
  let sum = 0;
  for (let i = 0; i < a.length; i++) sum += (a[i] - b[i]) ** 2;
  return Math.sqrt(sum);
}

function computeResults(userDims) {
  const matches = POKEMON.map(p => ({
    pokemon: p, dist: euclideanDist(userDims, p.slice(3))
  }));
  matches.sort((a, b) => a.dist - b.dist);
  results = { top: matches[0], userDims, all: matches };
}

        <div class="flex items-center justify-center gap-2 mt-1.5">
          <div class="radial-progress text-primary font-bold" style="--value:${pctNum};--size:4rem;--thickness:4px;font-size:0.7rem" role="progressbar">${matchPct}%</div>

      <!-- ══ 观测笔记 ══ -->

        <p class="font-bold text-base-content/80 mb-1.5 text-xs tracking-wider">📋 观测笔记</p>

        <div class="flex flex-col gap-2">

function generateDescription(p, dist, userDims, pokeDims) {
  const name = p[1];
  const simPct = (Math.max(0, (1 - dist / 20.1) * 100)).toFixed(1);
  const pctN = parseFloat(simPct);
  const dmZh = ['活力','理性','冒险精神','伙伴羁绊','意志力'];
  const dmIcon = ['⚡','🧠','🗡️','🤝','🔥'];

  // Find strongest & weakest user dims
  let maxD = 0, maxI = 0, minD = 99, minI = 0;
  userDims.forEach((d, i) => { if (d > maxD) { maxD = d; maxI = i; } if (d < minD) { minD = d; minI = i; } });

  // Find closest match
  let bestGap = 99, bestI = 0, worstGap = 0, worstI = 0;
  for (let i = 0; i < 5; i++) {
    const g = Math.abs(userDims[i] - pokeDims[i]);
    if (g < bestGap) { bestGap = g; bestI = i; }
    if (g > worstGap) { worstGap = g; worstI = i; }
  }

  const highDims = [], lowDims = [], alignedDims = [];
  for (let i = 0; i < 5; i++) {
    if (userDims[i] >= 6.5) highDims.push(i);
    if (userDims[i] <= 3.5) lowDims.push(i);
    if (Math.abs(userDims[i] - pokeDims[i]) < 0.5) alignedDims.push(i);
  }

  // ── 属性气质 ──

    return a[t] || '拥有一种说不清道不明的魅力';
  };
  const typeStr = p[2].split('/')[0];
  const TYPE_MAP = {'Normal':'一般','Fire':'火','Water':'水','Electric':'电','Grass':'草','Ice':'冰','Fighting':'格斗','Poison':'毒','Ground':'地面','Flying':'飞行','Psychic':'超能力','Bug':'虫','Rock':'岩石','Ghost':'幽灵','Dragon':'龙','Dark':'恶','Steel':'钢','Fairy':'妖精'};
  const aura = typeAura(TYPE_MAP[typeStr] || typeStr);

  // ── 图鉴口吻的个性素描 ──
  const sketches = {
    0: highDims.includes(0)
      ? '你就像那种即使暴风雨天也要冲出去迎风奔跑的宝可梦——浑身是劲儿，见到谁都想上去打招呼。'
      : '你不是那种见了人就往上扑的类型，更习惯待在自己的节奏里，但真正需要你的时候你从不缺席。',
    1: highDims.includes(1)
      ? '你的脑子永远在运转。遇到一件事你不会急着冲上去，而是先站在原地观察三秒——这三秒里你已经算好了所有可能。'
      : '你相信直觉比计算更可靠。有时候想太多反而错过了最好的时机，而你喜欢踩在那个时机上的感觉。',
    2: highDims.includes(2)
      ? '每当有未知的地平线出现在视野尽头，你内心的第一反应不是"危险"而是"走"——这种冒险精神是你最闪光的特质。'
      : '你走得慢但每一步都很稳，不喜欢在没摸清状况之前就莽撞出手。这份谨慎在这个世界并不多见。',
    3: highDims.includes(3)
      ? '你不是那种在任何场景都冲在最前面当英雄的人——而是那种会悄悄回头看看有没有人掉队、受伤、需要拉一把的人。'
      : '比起一大群同伴你更习惯独来独往。这不代表冷漠——只是你选择了把有限的力气留给那少数几个真正值得的人。',
    4: highDims.includes(4)

      : '你是个聪明人——打了三场还没赢就先退回去琢磨，而不是一条路走到黑。',
  };

  // ── 与name的共鸣故事 ──
  const resonate = alignedDims.length > 0

    : '你和' + name + '之间最明显的差异在' + dmIcon[worstI] + dmZh[worstI] + '。但这恰好说明：你是一个独一无二的组合，而不是任何一只宝可梦的翻版。';

  return /*html*/`
    <p class="mb-3"><span class="font-bold text-primary text-base">📖 「你的人格密码：${name}」</span></p>
    <p class="mb-3">${aura}。${sketches[0]} ${sketches[1]} ${sketches[2]} ${sketches[3]} ${sketches[4]}</p>
    <p class="mb-3">${resonate}</p>
    <p class="mt-3 text-xs text-base-content/30">—— 来自关都地区宝可梦博士大木研究室的档案记录</p>
  `;
}

// ============================================================
//  RADAR CHART
// ============================================================
function drawRadar(userDims, pokeDims, pokeName) {
  const canvas = document.getElementById('radarChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w/2, cy = h/2 + 4, r = 100, n = 5;
  const labels = ['⚡活力','🧠理性','🗡️冒险','🤝羁绊','🔥意志'];

  ctx.clearRect(0, 0, w, h);
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

  // Grid
  for (let lvl = 1; lvl <= 5; lvl++) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = (Math.PI*2/n)*i - Math.PI/2;
      const x = cx + (r/5)*lvl*Math.cos(a), y = cy + (r/5)*lvl*Math.sin(a);
      i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Axes
  for (let i = 0; i < n; i++) {
    const a = (Math.PI*2/n)*i - Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r*Math.cos(a), cy + r*Math.sin(a));
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  drawPoly(ctx, cx, cy, r, n, pokeDims, 'rgba(227,53,13,.35)', '#E3350D', 2.5);
  drawPoly(ctx, cx, cy, r, n, userDims, 'rgba(59,76,202,.35)', '#3B4CCA', 2.5);

  // Labels
  ctx.fillStyle = '#333';
  ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const a = (Math.PI*2/n)*i - Math.PI/2;
    ctx.fillText(labels[i], cx + (r+22)*Math.cos(a), cy + (r+22)*Math.sin(a));
  }

  // Legend
  ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#3B4CCA'; ctx.fillRect(cx-70, cy+r+24, 12, 12);
  ctx.fillStyle = '#333'; ctx.textAlign = 'left'; ctx.fillText('你', cx-54, cy+r+30);
  ctx.fillStyle = '#E3350D'; ctx.fillRect(cx+14, cy+r+24, 12, 12);
  ctx.fillStyle = '#333'; ctx.fillText(pokeName, cx+30, cy+r+30);
}

function drawPoly(ctx, cx, cy, r, n, dims, fill, stroke, lw) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = (Math.PI*2/n)*i - Math.PI/2;
    const x = cx + r*(dims[i]/10)*Math.cos(a), y = cy + r*(dims[i]/10)*Math.sin(a);
    i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke();
  for (let i = 0; i < n; i++) {
    const a = (Math.PI*2/n)*i - Math.PI/2;
    ctx.beginPath();
    ctx.arc(cx + r*(dims[i]/10)*Math.cos(a), cy + r*(dims[i]/10)*Math.sin(a), 4, 0, Math.PI*2);
    ctx.fillStyle = stroke; ctx.fill();
  }
}

function shareResult() {
  const r = results.top, p = r.pokemon;
  const simPct = (Math.max(0, (1 - r.dist / 20.1) * 100)).toFixed(1);
  const dimNames = ['活力','理性','冒险','羁绊','意志'];
  const text = `🌍 Pokémon Ti 🌍\n\n✨ 我的宝可梦人格：${p[1]}（No.${p[0]}）\n🎯 匹配度：${simPct}%\n📊 人格维度：\n${dimNames.map((d, i) => `  ${d}: ${Math.round(results.userDims[i] * 10) / 10}/10`).join('\n')}\n\n😎 你也来测测你的宝可梦人格！`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast());
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast();
  }
}

function showToast() {
  const t = document.getElementById('copyToast');
  t.classList.remove('translate-y-20', 'opacity-0');
  t.classList.add('translate-y-0', 'opacity-100');
  setTimeout(() => {
    t.classList.add('translate-y-20', 'opacity-0');
    t.classList.remove('translate-y-0', 'opacity-100');
  }, 2000);
}

// ============================================================
//  BGM
// ============================================================
async function toggleBGM(e) {
  if (e) e.preventDefault();
  const btn = document.getElementById('bgmToggle');
  const audio = document.getElementById('bgmAudio');
  if (!audio || !btn) return;

  if (audio.paused) {
    try {
      await audio.play();
      btn.textContent = '🎵';
      btn.classList.add('border-secondary');
      btn.classList.remove('border-white/20');
    } catch (_) {
      btn.textContent = '🔇';
    }
  } else {
    audio.pause();
    btn.textContent = '🔇';
    btn.classList.remove('border-secondary');
    btn.classList.add('border-white/20');
  }
}
